<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>leader board</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="wrapper">
      <form id="leaderform">
        <label>First Name:
          <input type="text" placeholder="First Name" id="firstname"/></label>
        <label>Last Name: <input type="text" placeholder="Last Name" id="lastname"/></label>
        <select id="country" required>
          <option value="">Select Country</option>
          <option value="India">India</option>
          <option value="USA">USA</option>
          <option value="Australia">Australia</option>
          <option value="Russia">Russia</option>
        </select>
        <label>Score: <input type="text" placeholder="Enter Score" id="score"/></label>
        <button type="submit" id="button">ADD</button>
      </form>
      <div id="playerlist"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
